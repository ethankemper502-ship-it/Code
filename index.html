<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sky Runner VR</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  </head>
  <body>
    <div class="hud">
      <div>
        <h1>Sky Runner VR</h1>
        <p>Dodge incoming neon barriers and survive as long as you can.</p>
      </div>
      <div class="hud__stats">
        <span>Score: <strong id="score">0</strong></span>
        <span>Best: <strong id="best">0</strong></span>
      </div>
      <div class="hud__buttons">
        <button id="startButton">Start / Restart</button>
        <p>Desktop: drag to look, then use <kbd>A</kbd>/<kbd>D</kbd> or <kbd>←</kbd>/<kbd>→</kbd> to strafe.</p>
        <p>VR: enter VR and lean or use controllers to avoid barriers.</p>
      </div>
    </div>

    <a-scene
      background="color: #050816"
      vr-mode-ui="enabled: true"
      renderer="colorManagement: true; physicallyCorrectLights: true"
    >
      <a-assets>
        <audio id="hitSound" src="https://cdn.pixabay.com/audio/2022/03/15/audio_c8b9c0d6f0.mp3" preload="auto"></audio>
      </a-assets>

      <a-entity light="type: ambient; color: #8ec5ff; intensity: 0.7"></a-entity>
      <a-entity light="type: directional; color: #ffffff; intensity: 0.9" position="-1 3 2"></a-entity>

      <a-sky color="#050816"></a-sky>
      <a-entity id="stars"></a-entity>

      <a-plane rotation="-90 0 0" width="60" height="140" color="#0a1229" position="0 0 -30"></a-plane>
      <a-entity id="laneMarkers"></a-entity>
      <a-entity id="obstacles"></a-entity>

      <a-entity id="playerRig" position="0 1.6 4">
        <a-camera wasd-controls-enabled="false"></a-camera>
      </a-entity>

      <a-entity position="0 4 -14" text="value: SKY RUNNER VR; align: center; color: #7df9ff; width: 18"></a-entity>
      <a-entity position="0 3.3 -14" text="value: Dodge the barriers.; align: center; color: #ffffff; width: 12"></a-entity>
    </a-scene>

    <script src="game.js"></script>
  </body>
</html>
